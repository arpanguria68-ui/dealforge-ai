# DealForge AI — Full Project Docker Compose
# Runs entire DealForge stack: Backend FastAPI + Frontend React (nginx)
#
# Usage:
#   1. Edit the .env.docker file with your API keys
#   2. docker compose --env-file .env.docker up --build -d
#   3. Open http://localhost:3000 in browser
#
version: "3.9"

services:
  # ═══════════════════════════════ BACKEND ═══════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealforge-backend
    ports:
      - "8005:8000"
    environment:
      # Database
      - DATABASE_URL=sqlite+aiosqlite:///./data/dealforge.db
      # App config
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - PAGEINDEX_MODE=${PAGEINDEX_MODE:-local}
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - REPORTS_DIR=/app/reports
      # API Keys from .env.docker
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # Financial Data API Keys
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      # SEC Filing Due Diligence (optional — paid sec-api.io tier)
      - SEC_API_KEY=${SEC_API_KEY:-}
      # Model overrides
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-large-latest}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # NVIDIA
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-z-ai/glm5}
      # Vertex AI
      - VERTEX_API_KEY=${VERTEX_API_KEY:-}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-1.5-flash-002}
      # Search
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - SEARXNG_INSTANCE_URL=${SEARXNG_INSTANCE_URL:-}
      - SEARXNG_API_KEY=${SEARXNG_API_KEY:-}
      # Google Cloud
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      # PRD Settings
      - MEMORY_STALENESS_DAYS=${MEMORY_STALENESS_DAYS:-30}
      - DEAL_ISOLATION_MODE=${DEAL_ISOLATION_MODE:-true}
      - SEARCH_CACHE_TTL=${SEARCH_CACHE_TTL:-86400}
      - MAX_CLARIFICATION_DEPTH=${MAX_CLARIFICATION_DEPTH:-3}
    volumes:
      # Persist SQLite DBs across restarts (tasks, quality, items)
      - dealforge-db:/app/data
      # Persist generated reports
      - dealforge-reports:/app/reports
      # Persist user settings
      - ./backend/settings.json:/app/settings.json
      # Mount external Knowledge Base folder
      - "./Knowledge managerment:/app/knowledge_base"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - dealforge-net

  redis:
    image: redis:7-alpine
    container_name: dealforge-redis
    ports:
      - "6379:6379"
    volumes:
      - dealforge-redis-data:/data
    restart: unless-stopped
    networks:
      - dealforge-net

  # ═══════════════════════════════ FRONTEND ══════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.docker
    container_name: dealforge-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=http://localhost:8005
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dealforge-net

volumes:
  dealforge-db:
  dealforge-reports:
  dealforge-redis-data:


networks:
  dealforge-net:
    driver: bridge
