name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tracked-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files for secrets
        run: python scripts/scan_tracked_secrets.py
